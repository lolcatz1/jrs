<!doctype html>
<html><head><meta charset="utf-8"><title>jrs vs three.js benchmark</title>
<style>body{font-family:system-ui;background:#111;color:#ddd;margin:16px} canvas{background:#000;display:block;margin-bottom:8px} pre{white-space:pre-wrap}</style>
</head>
<body>
<canvas id="c" width="320" height="240"></canvas>
<pre id="log"></pre>
<script type="module">
import * as JRS from '/src/index.js';
import * as THREE from '/node_modules/three/build/three.module.js';
import { scenarios } from '/bench/scenarios.js';
import { WebGLRenderList } from '/src/renderers/webgl/WebGLRenderLists.js';

const libs = { jrs: JRS, three: THREE };
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };


const median = (a) => { if (!a.length) return null; const b = a.slice().sort((x, y) => x - y); return b[b.length >> 1]; };
const r3 = (v) => v === null || v === undefined ? null : +v.toFixed(3);

/**
 * GPU-side cost per frame. Runs `frames` extra frames after the JS-timed loop (so the JS numbers are unaffected).
 *  - gpuMs: median EXT_disjoint_timer_query_webgl2 TIME_ELAPSED around the whole frame (all passes), results polled
 *    a few frames later (never blocking inside the loop), frames flagged GPU_DISJOINT discarded. null if the extension is missing.
 *  - finishMs: median wall time of doFrame + gl.finish() per frame: the fallback GPU proxy (it also contains the CPU work,
 *    so it is an upper bound on CPU+GPU, not pure GPU).
 */
function measureGpu(gl, doFrame, firstFrame, frames) {
	const out = { gpuSource: 'none', gpuMs: null, gpuSamples: 0, gpuDisjoint: 0, finishMs: null, finishWaitMs: null, timerMs: null };
	let timerOk = false;
	const ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
	let f = firstFrame;
	if (ext) {
		const pending = [], gpu = [];
		let disjoint = 0;
		const poll = (final) => {
			if (!pending.length) return;
			const dj = gl.getParameter(ext.GPU_DISJOINT_EXT);
			while (pending.length && (final || gl.getQueryParameter(pending[0], gl.QUERY_RESULT_AVAILABLE))) {
				const q = pending.shift();
				if (dj) disjoint++; else gpu.push(gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6);
				gl.deleteQuery(q);
			}
		};
		gl.getParameter(ext.GPU_DISJOINT_EXT); // clear the sticky flag
		for (let i = 0; i < frames; i++) {
			const q = gl.createQuery();
			gl.beginQuery(ext.TIME_ELAPSED_EXT, q);
			doFrame(f++);
			gl.endQuery(ext.TIME_ELAPSED_EXT);
			pending.push(q);
			if (i >= 3) poll(false); // a few frames of latency
		}
		gl.finish();
		poll(true);
		out.timerMs = r3(median(gpu)); out.gpuSamples = gpu.length; out.gpuDisjoint = disjoint;
		// SwiftShader exposes the extension but returns 0 ns for every query: treat an all-zero / empty result as 'timer unusable'
		timerOk = gpu.length >= frames / 2 && gpu.some((v) => v > 0) && out.timerMs > 0;
		if (timerOk) { out.gpuSource = 'EXT_disjoint_timer_query_webgl2'; out.gpuMs = out.timerMs; }
	}
	const fin = [], wait = [];
	gl.finish();
	for (let i = 0; i < frames; i++) { const s = performance.now(); doFrame(f++); const m = performance.now(); gl.finish(); const e = performance.now(); fin.push(e - s); wait.push(e - m); }
	out.finishMs = r3(median(fin)); out.finishWaitMs = r3(median(wait));
	if (!timerOk) { out.gpuSource = ext ? 'gl.finish() wall time per frame (timer query extension present but returns 0 ns)' : 'gl.finish() wall time per frame (no timer query extension)'; out.gpuMs = out.finishMs; }
	out.nextFrame = f;
	return out;
}

/** Pure renderer CPU: draw calls stubbed to no-ops, median over chunks of frames (performance.now() is coarse here). DESTRUCTIVE: run last. */
function measureCpuStubbed(gl, doFrame, firstFrame, chunks = 30, chunk = 20) {
	for (const nm of ['drawElements', 'drawArrays', 'drawElementsInstanced', 'drawArraysInstanced', 'drawRangeElements']) gl[nm] = function () {};
	const ext = gl.getExtension('WEBGL_multi_draw');
	if (ext) for (const nm of ['multiDrawElementsWEBGL', 'multiDrawArraysWEBGL', 'multiDrawElementsInstancedWEBGL', 'multiDrawArraysInstancedWEBGL']) ext[nm] = function () {};
	let f = firstFrame;
	for (let i = 0; i < 20; i++) doFrame(f++);
	const per = [];
	for (let c = 0; c < chunks; c++) { const s = performance.now(); for (let i = 0; i < chunk; i++) doFrame(f++); per.push((performance.now() - s) / chunk); }
	return r3(median(per));
}

/**
 * Runs one scenario with one library on a fresh canvas and returns timings.
 * frames: measured frames after warmup. Timing is the JS time spent in scene update + render.
 */
window.runScenario = async function (libName, scenarioName, opts = {}) {
	const T = libs[libName];
	const sc = scenarios[scenarioName];
	const n = opts.n || sc.n;
	const frames = opts.frames || 60, warmup = opts.warmup ?? 40;
	const canvas = document.createElement('canvas');
	canvas.width = 320; canvas.height = 240;
	document.body.appendChild(canvas);
	const renderer = new T.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
	renderer.setSize(320, 240, false);
	if (scenarioName.startsWith('shadows')) renderer.shadowMap.enabled = true;
	if (opts.autoMultiDraw === false && 'autoMultiDraw' in renderer) renderer.autoMultiDraw = false;
	if (scenarioName.startsWith('shader-client')) { renderer.dispose(); canvas.remove(); return runScenarioStencil(T, libName, scenarioName, sc, n, frames, warmup, opts); }
	const t0 = performance.now();
	const { scene, camera, update, warm } = sc.build(T, n);
	const buildMs = performance.now() - t0;
	const gl = renderer.getContext();
	if (warm) warm(renderer);
	for (let f = 0; f < warmup; f++) { if (update) update(f); renderer.render(scene, camera); }
	gl.finish();
	// one instrumented frame: count GL calls by category (timed frames below run un-instrumented)
	const glCalls = opts.countGL === false ? null : countGLCalls(gl, () => { if (update) update(warmup); renderer.render(scene, camera); });
	const glErrors = gl.getError();
	let jsMs = 0, best = Infinity, worst = 0;
	const samples = [], renderSamples = [];
	const wall0 = performance.now();
	for (let f = 0; f < frames; f++) {
		const s = performance.now();
		if (update) update(warmup + f);
		const s1 = performance.now();
		renderer.render(scene, camera);
		const e = performance.now();
		const d = e - s;
		renderSamples.push(e - s1);
		jsMs += d; if (d < best) best = d; if (d > worst) worst = d; samples.push(d);
	}
	renderSamples.sort((a, b) => a - b);
	gl.finish();
	const wallMs = performance.now() - wall0;
	const doFrame1 = (f) => { if (update) update(f); renderer.render(scene, camera); };
	const gpu = opts.gpu === false ? null : measureGpu(gl, doFrame1, warmup + frames, frames);
	const cpuOnlyMs = opts.cpuStubbed ? measureCpuStubbed(gl, doFrame1, warmup + frames * 3) : null;
	const rawSamples = opts.raw ? samples.slice() : null;
	samples.sort((a, b) => a - b);
	const info = renderer.info.render;
	const result = {
		lib: libName, scenario: scenarioName, n, frames,
		buildMs: +buildMs.toFixed(2),
		renderMedianMs: +renderSamples[renderSamples.length >> 1].toFixed(3), avgMs: +(jsMs / frames).toFixed(3), medianMs: +samples[samples.length >> 1].toFixed(3), bestMs: +best.toFixed(3), worstMs: +worst.toFixed(3),
		wallAvgMs: +(wallMs / frames).toFixed(3),
		drawCalls: info.calls, triangles: Math.round(info.triangles),
		programs: renderer.info.programs ? renderer.info.programs.length : undefined,
		glCalls, glError: glErrors,
		warmup, ...(gpu ? { gpuMs: gpu.gpuMs, gpuSource: gpu.gpuSource, gpuSamples: gpu.gpuSamples, gpuDisjoint: gpu.gpuDisjoint, finishMs: gpu.finishMs, finishWaitMs: gpu.finishWaitMs, timerMs: gpu.timerMs } : {}),
		...(cpuOnlyMs !== null ? { cpuOnlyMs } : {}),
	};
	if (rawSamples) result.rawSamples = rawSamples.map((v) => +v.toFixed(2));
	// capture a thumbnail for visual sanity
	if (opts.capture) result.image = canvas.toDataURL('image/png');
	renderer.dispose();
	canvas.remove();
	log(JSON.stringify(result));
	return result;
};

/** Variant for scenes that need a stencil buffer and may render several passes per frame via `frame(renderer)`. */
async function runScenarioStencil(T, libName, scenarioName, sc, n, frames, warmup, opts) {
	const canvas = document.createElement('canvas'); canvas.width = 320; canvas.height = 240; document.body.appendChild(canvas);
	const renderer = new T.WebGLRenderer({ canvas, antialias: false, stencil: true, powerPreference: 'high-performance' });
	renderer.setSize(320, 240, false);
	const t0 = performance.now();
	const built = sc.build(T, n);
	const { scene, camera, update, warm, frame } = built;
	const buildMs = performance.now() - t0;
	const gl = renderer.getContext();
	if (warm) warm(renderer);
	const doFrame = (f) => { if (update) update(f); if (frame) frame(renderer); else renderer.render(scene, camera); };
	for (let f = 0; f < warmup; f++) doFrame(f);
	gl.finish();
	// per-pass GL call counts for one frame
	const passes = [];
	const origRender = renderer.render.bind(renderer);
	let current = null;
	renderer.render = (s, c) => { current = { uniform: 0, useProgram: 0, draw: 0, bindTexture: 0, bindVertexArray: 0, total: 0 }; passes.push(current); origRender(s, c); };
	const hasTrace = renderer.debug && Array.isArray(renderer.debug.uniformTrace);
	if (hasTrace) { renderer.debug.traceUniforms = true; renderer.debug.uniformTrace.length = 0; }
	const glCalls = countGLCalls(gl, () => doFrame(warmup), (cat) => { if (current) { current.total++; if (cat) current[cat] = (current[cat] || 0) + 1; } });
	if (hasTrace) renderer.debug.traceUniforms = false;
	renderer.render = origRender;
	const glErrors = gl.getError();
	let jsMs = 0, best = Infinity, worst = 0;
	const samples = [];
	const wall0 = performance.now();
	for (let f = 0; f < frames; f++) { const s = performance.now(); doFrame(warmup + 1 + f); const d = performance.now() - s; jsMs += d; if (d < best) best = d; if (d > worst) worst = d; samples.push(d); }
	gl.finish();
	const wallMs = performance.now() - wall0;
	samples.sort((a, b) => a - b);
	const info = renderer.info.render;
	const gpu = opts.gpu === false ? null : measureGpu(gl, doFrame, warmup + 1 + frames, frames);
	const cpuOnlyMs = opts.cpuStubbed ? measureCpuStubbed(gl, doFrame, warmup + 1 + frames * 3) : null;
	const uniformTrace = hasTrace ? renderer.debug.uniformTrace.map((t) => ({ target: t.target, useProgram: t.useProgram, draws: t.draws, uniforms: t.uniforms })) : undefined;
	const result = {
		lib: libName, scenario: scenarioName, n, frames, buildMs: +buildMs.toFixed(2),
		avgMs: +(jsMs / frames).toFixed(3), medianMs: +samples[samples.length >> 1].toFixed(3), bestMs: +best.toFixed(3), worstMs: +worst.toFixed(3), wallAvgMs: +(wallMs / frames).toFixed(3),
		drawCalls: info.calls, triangles: Math.round(info.triangles), programs: renderer.info.programs ? renderer.info.programs.length : undefined,
		warmup, ...(gpu ? { gpuMs: gpu.gpuMs, gpuSource: gpu.gpuSource, gpuSamples: gpu.gpuSamples, gpuDisjoint: gpu.gpuDisjoint, finishMs: gpu.finishMs, finishWaitMs: gpu.finishWaitMs, timerMs: gpu.timerMs } : {}),
		...(cpuOnlyMs !== null ? { cpuOnlyMs } : {}),
		glCalls, glError: glErrors, passes: passes.map((p, i) => ({ name: built.passes ? built.passes[i] : 'pass ' + i, ...p })), uniformTrace,
	};
	renderer.dispose(); canvas.remove();
	log(JSON.stringify(result));
	return result;
}

/** Wraps the context's methods for one call of fn() and counts calls per category. */
function countGLCalls(gl, fn, onCall) {
	const counts = { uniform: 0, bindTexture: 0, useProgram: 0, bindVertexArray: 0, draw: 0, bindBuffer: 0, bufferData: 0, state: 0, total: 0 };
	const proto = Object.getPrototypeOf(gl);
	const originals = {};
	for (const name of Object.getOwnPropertyNames(proto)) {
		if (typeof gl[name] !== 'function' || name === 'getError' || name.startsWith('get')) continue;
		originals[name] = gl[name];
		const cat = name.startsWith('uniform') ? 'uniform' : name === 'bindTexture' || name === 'activeTexture' ? 'bindTexture' : name === 'useProgram' ? 'useProgram' : name === 'bindVertexArray' ? 'bindVertexArray'
			: name.startsWith('draw') ? 'draw' : name === 'bindBuffer' || name === 'bindBufferRange' || name === 'bindBufferBase' ? 'bindBuffer' : name === 'bufferData' || name === 'bufferSubData' ? 'bufferData'
			: /^(enable|disable|depth|blend|cull|frontFace|colorMask|stencil|polygonOffset|viewport|scissor|clear)/.test(name) ? 'state' : null;
		gl[name] = function (...args) { counts.total++; if (cat) counts[cat]++; if (onCall) onCall(cat); return originals[name].apply(gl, args); };
	}
	try { fn(); } finally { for (const name in originals) delete gl[name]; }
	return counts;
}

/** Renders the same scenario with both libraries and returns mean absolute pixel difference (0..255). */
window.compareScenario = async function (scenarioName, n) {
	const sc = scenarios[scenarioName];
	const images = {};
	for (const libName of ['jrs', 'three']) {
		const T = libs[libName];
		const canvas = document.createElement('canvas'); canvas.width = 320; canvas.height = 240;
		const renderer = new T.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true, stencil: true });
		renderer.setSize(320, 240, false);
		if (scenarioName.startsWith('shadows')) renderer.shadowMap.enabled = true;
		const { scene, camera, update, warm, frame } = sc.build(T, n || sc.n);
		if (warm) warm(renderer);
		const cf = sc.compareFrames || 1;
		for (let f = 0; f < cf; f++) { if (update) update(f); if (f < cf - 1) renderer.render(scene, camera); }
		if (frame) { frame(renderer); frame(renderer); } else renderer.render(scene, camera);
		const gl = renderer.getContext();
		const px = new Uint8Array(320 * 240 * 4);
		gl.readPixels(0, 0, 320, 240, gl.RGBA, gl.UNSIGNED_BYTE, px);
		images[libName] = { px, url: canvas.toDataURL('image/png') };
		renderer.dispose();
	}
	let sum = 0, maxd = 0, bad = 0, differing = 0;
	const a = images.jrs.px, b = images.three.px;
	const samples = [];
	for (let i = 0; i < a.length; i += 4) {
		const d = Math.max(Math.abs(a[i] - b[i]), Math.abs(a[i + 1] - b[i + 1]), Math.abs(a[i + 2] - b[i + 2]));
		sum += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
		if (d > maxd) maxd = d; if (d > 32) bad++;
		if (d > 0) { differing++; if (samples.length < 6 && d > 8) samples.push({ x: (i / 4) % 320, y: 239 - Math.floor(i / 4 / 320), jrs: [a[i], a[i + 1], a[i + 2]], three: [b[i], b[i + 1], b[i + 2]] }); }
	}
	const count = a.length * 3 / 4;
	return { scenario: scenarioName, meanAbsDiff: +(sum / count).toFixed(3), maxDiff: maxd, fractionOver32: +(bad / count).toFixed(4), differingPixels: differing, samples, jrs: images.jrs.url, three: images.three.url };
};
/** Captures `frames` rendered images of a scenario (camera orbiting once) plus the JS time spent in each render. */
window.captureScenario = async function (libName, scenarioName, opts = {}) {
	const T = libs[libName];
	const sc = scenarios[scenarioName];
	const n = opts.n || sc.n, frames = opts.frames || 120, warmup = 5;
	const width = opts.width || 480, height = opts.height || 360;
	const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height; document.body.appendChild(canvas);
	const renderer = new T.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true, stencil: true });
	renderer.setSize(width, height, false);
	if (scenarioName.startsWith('shadows')) renderer.shadowMap.enabled = true;
	const { scene, camera, update, warm, frame } = sc.build(T, n);
	camera.aspect = width / height; camera.updateProjectionMatrix();
	if (warm) warm(renderer);
	const r = camera.position.length(), y0 = camera.position.y;
	const rxz = Math.sqrt(r * r - y0 * y0);
	const base = Math.atan2(camera.position.x, camera.position.z);
	const orbit = (f) => { if (opts.orbit === false) return; const a = base + (f / frames) * Math.PI * 2; camera.position.set(rxz * Math.sin(a), y0, rxz * Math.cos(a)); camera.lookAt(0, 0, 0); };
	const gl = renderer.getContext();
	for (let f = 0; f < warmup; f++) { if (update) update(f); orbit(0); if (frame) frame(renderer); else renderer.render(scene, camera); }
	gl.finish();
	const images = [], times = [];
	for (let f = 0; f < frames; f++) {
		if (update) update(warmup + f);
		orbit(f);
		const s = performance.now();
		if (frame) frame(renderer); else renderer.render(scene, camera);
		times.push(performance.now() - s);
		images.push(canvas.toDataURL('image/png'));
	}
	const calls = renderer.info.render.calls;
	renderer.dispose(); canvas.remove();
	return { lib: libName, scenario: scenarioName, times, images, drawCalls: calls };
};
/** Time spent inside WebGLRenderList.finish (key build + sort) per frame, jrs only, over `frames` frames. Returns microseconds per call. */
window.sortCost = async function (scenarioName, frames = 300) {
	const sc = scenarios[scenarioName];
	const canvas = document.createElement('canvas'); canvas.width = 320; canvas.height = 240; document.body.appendChild(canvas);
	const renderer = new JRS.WebGLRenderer({ canvas, antialias: false, stencil: true });
	renderer.setSize(320, 240, false);
	if (scenarioName === 'shadows') renderer.shadowMap.enabled = true;
	const { scene, camera, update, warm } = sc.build(JRS, sc.n);
	if (warm) warm(renderer);
	const original = WebGLRenderList.prototype.finish;
	let total = 0, calls = 0, measuring = false;
	WebGLRenderList.prototype.finish = function (a, b) { if (!measuring) return original.call(this, a, b); const s = performance.now(); original.call(this, a, b); total += performance.now() - s; calls++; };
	for (let f = 0; f < 20; f++) { if (update) update(f); renderer.render(scene, camera); }
	measuring = true;
	for (let f = 0; f < frames; f++) { if (update) update(20 + f); renderer.render(scene, camera); }
	WebGLRenderList.prototype.finish = original;
	renderer.dispose(); canvas.remove();
	return { scenario: scenarioName, finishUsPerFrame: +(total / frames * 1000).toFixed(1), callsPerFrame: calls / frames };
};
window.ready = true;
</script>
</body></html>
